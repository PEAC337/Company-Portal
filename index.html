    <style>
      .font-brand {
        font-family: 'Major Mono Display', monospace;
      }
      body {
        font-family: 'Inter', sans-serif;
        background-color: #020617; /* Almost black-blue */
        /* Add a subtle glow from the top center */
        background-image: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(37, 99, 235, 0.3), transparent),
                          /* Add the tech grid pattern */
                          linear-gradient(rgba(203, 213, 225, 0.05) 1px, transparent 1px),
                          linear-gradient(to right, rgba(203, 213, 225, 0.05) 1px, transparent 1px);
        background-size: 100% 100%, 3rem 3rem, 3rem 3rem;
        background-attachment: fixed; /* Keep the background fixed during scroll */
        -webkit-tap-highlight-color: transparent; /* Remove tap highlight on iOS */
      }
      
      @keyframes rotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes counter-rotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(-360deg); }
      }
      .orrery-container {
        min-height: 750px;
      }
      @media (max-width: 800px) {
        .orrery-container {
            transform: scale(0.8);
            min-height: 600px;
        }
      }
      @media (max-width: 640px) {
          .orrery-container {
              transform: scale(0.6);
              min-height: 480px;
          }
      }
      @media (max-width: 480px) {
          .orrery-container {
              transform: scale(0.45);
              min-height: 380px;
          }
      }
    </style>
